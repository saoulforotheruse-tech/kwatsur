services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kwatsur}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kwatsur_dev}
      POSTGRES_DB: ${POSTGRES_DB:-kwatsur}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kwatsur_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-kwatsur} -d ${POSTGRES_DB:-kwatsur}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    # Les clés des intégrations (Nemotron, Zetaris, Meterless) sont lues depuis .env.
    env_file:
      - path: .env
        required: false
    environment:
      # Surcharge .env : dans Docker, la base est joignable sous le nom « db ».
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kwatsur}:${POSTGRES_PASSWORD:-kwatsur_dev}@db:5432/${POSTGRES_DB:-kwatsur}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      # Le Meterless Runtime tourne sur la machine hôte, pas dans le conteneur.
      METERLESS_BASE_URL: ${METERLESS_DOCKER_BASE_URL:-http://host.docker.internal:8088/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Photos des propriétaires et illustrations IA : conservées entre les redémarrages.
      - kwatsur_media:/app/media
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"

volumes:
  kwatsur_pgdata:
  kwatsur_media:
