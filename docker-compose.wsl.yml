# Surcharge pour Docker dans WSL avec Zetaris et Meterless Nightshift en local.
# Nightshift (Windows) et l'API Zetaris n'écoutent que sur 127.0.0.1 : l'API Kwatsur
# partage donc le réseau de WSL (mode réseau « mirrored » requis côté WSL).
# Usage : docker compose -f docker-compose.yml -f docker-compose.wsl.yml up -d
services:
  api:
    network_mode: host
    ports: !reset []
    extra_hosts: !reset []
    environment:
      PORT: ${API_PORT:-8000}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kwatsur}:${POSTGRES_PASSWORD:-kwatsur_dev}@127.0.0.1:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-kwatsur}
      METERLESS_BASE_URL: ${METERLESS_BASE_URL:-http://127.0.0.1:8088/v1}

  # Zetaris lit la vue zetaris_listings sous le nom kwatsur-db, sur son propre réseau.
  db:
    networks:
      default:
      zetaris:
        aliases:
          - kwatsur-db

networks:
  zetaris:
    name: zetaris_default
    external: true
